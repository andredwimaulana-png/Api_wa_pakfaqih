<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - API WhatsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0F172A 0%, #1E293B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .header p {
            color: #94A3B8;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            margin-bottom: 6px;
        }

        .form-group label i {
            margin-right: 8px;
            color: #25D366;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #25D366;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #64748B;
        }

        .form-group .note {
            color: #64748B;
            font-size: 12px;
            margin-top: 4px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-row .btn-update {
            flex: 2;
            margin-top: 0;
        }

        .btn-row .btn-delete {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-row .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
        }

        .btn-row .btn-delete:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-update {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
        }

        .btn-update:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-box.success {
            display: block;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.2);
        }

        .result-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .result-box .result-message {
            color: #E2E8F0;
            font-size: 14px;
        }

        .result-box .result-detail {
            color: #94A3B8;
            font-size: 13px;
            margin-top: 6px;
        }

        .whatsapp-status {
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #94A3B8;
        }

        .whatsapp-status .wa-icon.success {
            color: #25D366;
        }

        .whatsapp-status .wa-icon.failed {
            color: #EF4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-link {
            text-align: center;
            color: #64748B;
            font-size: 13px;
            margin-top: 16px;
        }

        .footer-link a {
            color: #25D366;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .btn-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon"><i class="fas fa-user-edit"></i></div>
            <h1>Edit Profil</h1>
            <p>Perbarui data akun Anda</p>
        </div>

        <form id="editForm">
            <input type="hidden" id="userId">

            <div class="form-group">
                <label for="nama"><i class="fas fa-user"></i> Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>
            <div class="form-group">
                <label for="no_hp"><i class="fab fa-whatsapp"></i> Nomor WhatsApp</label>
                <input type="tel" id="no_hp" placeholder="081234567890" required>
            </div>
            <div class="form-group">
                <label for="alamat"><i class="fas fa-map-pin"></i> Alamat</label>
                <textarea id="alamat" placeholder="Masukkan alamat" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password Baru</label>
                <input type="password" id="password" placeholder="Kosongkan jika tidak ingin mengubah">
                <div class="note">Minimal 6 karakter. Kosongkan jika tidak ingin mengubah password.</div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-update" id="btnUpdate">
                    <span id="btnText">Update Profil</span>
                    <span class="spinner" id="btnSpinner"></span>
                    <i class="fas fa-save" id="btnIcon"></i>
                </button>
                <button type="button" class="btn-delete" id="btnDelete" onclick="handleDelete()">
                    <i class="fas fa-trash"></i> Hapus
                </button>
            </div>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-message" id="resultMessage"></div>
            <div class="result-detail" id="resultDetail"></div>
            <div class="whatsapp-status" id="waStatus" style="display:none;">
                <span class="wa-icon" id="waIcon"><i class="fab fa-whatsapp"></i></span>
                <span id="waText">Status WhatsApp: ...</span>
            </div>
        </div>

        <div class="footer-link">
            <a href="dashboard.html"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost/api_wa/api/update.php';
        const DELETE_URL = 'http://localhost/api_wa/api/delete.php';

        document.addEventListener('DOMContentLoaded', function () {
            // 🔥 CEK APAKAH SUDAH LOGIN
            const userData = JSON.parse(localStorage.getItem('userData') || 'null');
            console.log("📥 Data dari localStorage:", userData);

            if (!userData) {
                alert('⚠️ Sesi login habis! Silakan login ulang.');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userId').value = userData.id || '';
            document.getElementById('nama').value = userData.nama || '';
            document.getElementById('email').value = userData.email || '';
            document.getElementById('no_hp').value = userData.no_hp || '';
            document.getElementById('alamat').value = userData.alamat || '';
            console.log("✅ Form terisi dengan data user ID:", userData.id);

            document.getElementById('editForm').addEventListener('submit', handleUpdate);
        });

        function handleUpdate(e) {
            if (e) e.preventDefault();

            const id = document.getElementById('userId').value;
            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const no_hp = document.getElementById('no_hp').value.trim();
            const alamat = document.getElementById('alamat').value.trim();
            const password = document.getElementById('password').value.trim();

            console.log("📤 Data yang dikirim:", { id, nama, email, no_hp, alamat, password });

            if (!id || !nama || !email || !no_hp) {
                showResult('error', '❌ Data tidak lengkap',
                    `id: ${id ? 'ada' : 'kosong'}, nama: ${nama ? 'ada' : 'kosong'}, email: ${email ? 'ada' : 'kosong'}, no_hp: ${no_hp ? 'ada' : 'kosong'}`
                );
                return;
            }

            const btn = document.getElementById('btnUpdate');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');

            btn.disabled = true;
            btnText.textContent = 'Memproses...';
            btnSpinner.classList.add('active');
            btnIcon.style.display = 'none';

            const data = { id, nama, email, no_hp, alamat };
            if (password && password.length >= 6) {
                data.password = password;
            }

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(response => {
                    console.log("📥 Response status:", response.status);
                    return response.json();
                })
                .then(result => {
                    console.log("📥 Response dari server:", result);

                    btn.disabled = false;
                    btnText.textContent = 'Update Profil';
                    btnSpinner.classList.remove('active');
                    btnIcon.style.display = 'inline-block';

                    if (result.status) {
                        showResult('success', '✅ ' + result.message, 'Data profil berhasil diperbarui!');

                        const waStatus = document.getElementById('waStatus');
                        const waText = document.getElementById('waText');
                        const waIcon = document.getElementById('waIcon');
                        waStatus.style.display = 'flex';
                        if (result.whatsapp && result.whatsapp.status === 'terkirim') {
                            waIcon.className = 'wa-icon success';
                            waIcon.innerHTML = '<i class="fab fa-whatsapp"></i>';
                            waText.textContent = '✅ Notifikasi perubahan dikirim ke WhatsApp!';
                        } else {
                            waIcon.className = 'wa-icon failed';
                            waIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                            waText.textContent = '⚠️ Notifikasi perubahan gagal dikirim.';
                        }

                        // Update localStorage
                        const userData = { id, nama, email, no_hp, alamat };
                        localStorage.setItem('userData', JSON.stringify(userData));

                    } else {
                        showResult('error', '❌ ' + result.message, result.debug ? JSON.stringify(result.debug) : '');
                        document.getElementById('waStatus').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error("❌ Error:", error);
                    btn.disabled = false;
                    btnText.textContent = 'Update Profil';
                    btnSpinner.classList.remove('active');
                    btnIcon.style.display = 'inline-block';
                    showResult('error', '❌ Terjadi kesalahan', error.message);
                    document.getElementById('waStatus').style.display = 'none';
                });
        }

        // ============================================================
        // 🔥 FUNGSI DELETE
        // ============================================================
        function handleDelete() {
            const id = document.getElementById('userId').value;
            const nama = document.getElementById('nama').value.trim();

            if (!id) {
                showResult('error', '❌ ID user tidak ditemukan', '');
                return;
            }

            if (!confirm(`⚠️ Yakin ingin menghapus akun "${nama}"?\n\nData yang dihapus tidak dapat dikembalikan!`)) {
                return;
            }

            const btn = document.getElementById('btnDelete');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...';

            fetch(`${DELETE_URL}?id=${id}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(result => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-trash"></i> Hapus';

                    if (result.status) {
                        showResult('success', '✅ ' + result.message, `Akun "${nama}" berhasil dihapus!`);
                        localStorage.removeItem('userData');
                        document.getElementById('editForm').reset();
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2500);
                    } else {
                        showResult('error', '❌ ' + result.message, '');
                        document.getElementById('waStatus').style.display = 'none';
                    }
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-trash"></i> Hapus';
                    showResult('error', '❌ Terjadi kesalahan', 'Periksa koneksi dan coba lagi.');
                    console.error('Error:', error);
                });
        }

        function showResult(type, message, detail) {
            const resultBox = document.getElementById('resultBox');
            const resultMsg = document.getElementById('resultMessage');
            const resultDetail = document.getElementById('resultDetail');
            resultBox.className = 'result-box ' + type;
            resultMsg.innerHTML = message;
            resultDetail.innerHTML = detail || '';
            resultBox.style.display = 'block';
        }
    </script>
</body>

</html>
