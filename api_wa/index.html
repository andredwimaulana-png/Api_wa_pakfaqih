<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - API WhatsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0F172A 0%, #1E293B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .header p {
            color: #94A3B8;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #E2E8F0;
            margin-bottom: 6px;
        }

        .form-group label i {
            margin-right: 8px;
            color: #25D366;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #25D366;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #64748B;
        }

        .form-group input.error {
            border-color: #EF4444;
        }

        .error-text {
            color: #EF4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.3);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-box.success {
            display: block;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.2);
        }

        .result-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .result-box .result-message {
            color: #E2E8F0;
            font-size: 14px;
        }

        .result-box .result-detail {
            color: #94A3B8;
            font-size: 13px;
            margin-top: 6px;
        }

        .whatsapp-status {
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #94A3B8;
        }

        .whatsapp-status .wa-icon.success {
            color: #25D366;
        }

        .whatsapp-status .wa-icon.failed {
            color: #EF4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-link {
            text-align: center;
            color: #64748B;
            font-size: 13px;
            margin-top: 16px;
        }

        .footer-link a {
            color: #25D366;
            text-decoration: none;
            font-weight: 600;
        }

        .redirect-info {
            margin-top: 12px;
            color: #34D399;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon"><i class="fab fa-whatsapp"></i></div>
            <h1>Daftar Akun</h1>
            <p>Dapatkan notifikasi WhatsApp setelah registrasi</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nama"><i class="fas fa-user"></i> Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
                <div class="error-text" id="namaError">Nama wajib diisi</div>
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
                <div class="error-text" id="emailError">Email tidak valid</div>
            </div>
            <div class="form-group">
                <label for="no_hp"><i class="fab fa-whatsapp"></i> Nomor WhatsApp</label>
                <input type="tel" id="no_hp" placeholder="Contoh: 081234567890" required>
                <div class="error-text" id="hpError">Nomor WhatsApp wajib diisi</div>
            </div>
            <div class="form-group">
                <label for="alamat"><i class="fas fa-map-pin"></i> Alamat</label>
                <textarea id="alamat" placeholder="Masukkan alamat" rows="2"></textarea>
                <div class="error-text" id="alamatError">Alamat wajib diisi</div>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required>
                <div class="error-text" id="passwordError">Password minimal 6 karakter</div>
            </div>
            <button type="submit" class="btn-register" id="btnRegister">
                <span id="btnText">Daftar Sekarang</span>
                <span class="spinner" id="btnSpinner"></span>
                <i class="fas fa-arrow-right" id="btnIcon"></i>
            </button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-message" id="resultMessage"></div>
            <div class="result-detail" id="resultDetail"></div>
            <div class="whatsapp-status" id="waStatus" style="display:none;">
                <span class="wa-icon" id="waIcon"><i class="fab fa-whatsapp"></i></span>
                <span id="waText">Status WhatsApp: ...</span>
            </div>
        </div>

        <div class="footer-link">
            Sudah punya akun? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost/api_wa/api/register.php';

        // 🔥 CEK JIKA SUDAH LOGIN - LANGSUNG KE DASHBOARD
        document.addEventListener('DOMContentLoaded', function () {
            const userData = JSON.parse(localStorage.getItem('userData') || 'null');

            if (userData && userData.id) {
                // Cek session dulu sebelum redirect
                fetch('api/check_session.php')
                    .then(r => r.json())
                    .then(data => {
                        if (data.status) {
                            window.location.href = 'dashboard.php';
                        } else {
                            // Session expired → hapus localStorage
                            localStorage.removeItem('userData');
                            document.getElementById('registerForm').addEventListener('submit', handleRegister);
                        }
                    })
                    .catch(() => {
                        localStorage.removeItem('userData');
                        document.getElementById('registerForm').addEventListener('submit', handleRegister);
                    });
            } else {
                document.getElementById('registerForm').addEventListener('submit', handleRegister);
            }
        });

        function handleRegister(e) {
            if (e) e.preventDefault();

            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const no_hp = document.getElementById('no_hp').value.trim();
            const alamat = document.getElementById('alamat').value.trim();
            const password = document.getElementById('password').value.trim();

            clearErrors();
            let valid = true;

            if (!nama) { showError('namaError'); valid = false; }
            if (!email || !email.includes('@')) { showError('emailError'); valid = false; }
            if (!no_hp) { showError('hpError'); valid = false; }
            if (!alamat) { showError('alamatError'); valid = false; }
            if (!password || password.length < 6) { showError('passwordError'); valid = false; }

            if (!valid) return;

            const btn = document.getElementById('btnRegister');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');

            btn.disabled = true;
            btnText.textContent = 'Memproses...';
            btnSpinner.classList.add('active');
            btnIcon.style.display = 'none';

            const data = { nama, email, no_hp, alamat, password };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(result => {
                    btn.disabled = false;
                    btnText.textContent = 'Daftar Sekarang';
                    btnSpinner.classList.remove('active');
                    btnIcon.style.display = 'inline-block';

                    const resultBox = document.getElementById('resultBox');
                    const resultMsg = document.getElementById('resultMessage');
                    const resultDetail = document.getElementById('resultDetail');
                    const waStatus = document.getElementById('waStatus');
                    const waText = document.getElementById('waText');
                    const waIcon = document.getElementById('waIcon');

                    resultBox.className = 'result-box';

                    if (result.status) {
                        resultBox.classList.add('success');
                        resultMsg.innerHTML = '✅ ' + result.message;
                        resultDetail.innerHTML = `
                            <div style="margin-top:8px;">
                                <strong>Nama:</strong> ${result.data.nama}<br>
                                <strong>Email:</strong> ${result.data.email}<br>
                                <strong>WhatsApp:</strong> ${result.data.no_hp}<br>
                                <strong>Alamat:</strong> ${result.data.alamat}
                            </div>
                        `;

                        waStatus.style.display = 'flex';
                        if (result.whatsapp.status === 'terkirim') {
                            waIcon.className = 'wa-icon success';
                            waIcon.innerHTML = '<i class="fab fa-whatsapp"></i>';
                            waText.textContent = '✅ WhatsApp berhasil dikirim!';
                        } else {
                            waIcon.className = 'wa-icon failed';
                            waIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                            waText.textContent = '⚠️ WhatsApp gagal, tapi data sudah tersimpan.';
                        }

                        document.getElementById('registerForm').reset();

                        // 🔥 SIMPAN DATA KE LOCALSTORAGE
                        localStorage.setItem('userData', JSON.stringify({
                            id: result.data.id,
                            nama: result.data.nama,
                            email: result.data.email,
                            no_hp: result.data.no_hp,
                            alamat: result.data.alamat || '',
                            role: result.data.role || 'user'
                        }));

                        // 🔥 TAMPILKAN INFO REDIRECT
                        const redirectInfo = document.createElement('div');
                        redirectInfo.className = 'redirect-info';
                        redirectInfo.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengarahkan ke dashboard...';
                        resultBox.appendChild(redirectInfo);

                        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        // 🔥 REDIRECT KE DASHBOARD setelah 2 detik
                        setTimeout(() => {
                            window.location.href = 'dashboard.php';
                        }, 2000);

                    } else {
                        resultBox.classList.add('error');
                        resultMsg.innerHTML = '❌ ' + result.message;
                        if (result.errors) {
                            resultDetail.innerHTML = result.errors.map(e => `• ${e}`).join('<br>');
                        } else {
                            resultDetail.textContent = 'Silakan coba lagi.';
                        }
                        waStatus.style.display = 'none';
                        resultBox.style.display = 'block';
                        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                })
                .catch(error => {
                    btn.disabled = false;
                    btnText.textContent = 'Daftar Sekarang';
                    btnSpinner.classList.remove('active');
                    btnIcon.style.display = 'inline-block';

                    const resultBox = document.getElementById('resultBox');
                    resultBox.className = 'result-box error';
                    document.getElementById('resultMessage').innerHTML = '❌ Terjadi kesalahan';
                    document.getElementById('resultDetail').textContent = 'Silakan periksa koneksi dan coba lagi.';
                    resultBox.style.display = 'block';
                    console.error('Error:', error);
                });
        }

        function showError(id) {
            document.getElementById(id).classList.add('show');
            const input = document.getElementById(id.replace('Error', ''));
            if (input) input.classList.add('error');
        }

        function clearErrors() {
            document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('input.error').forEach(el => el.classList.remove('error'));
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('registerForm');
                if (form.contains(e.target)) {
                    e.preventDefault();
                    handleRegister(e);
                }
            }
        });
    </script>
</body>

</html>
