<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - API WhatsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0F172A 0%, #1E293B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .header p {
            color: #94A3B8;
            font-size: 14px;
            margin-top: 4px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-card .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin: 0 auto 12px;
        }

        .user-card .name {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .user-card .email {
            text-align: center;
            font-size: 14px;
            color: #94A3B8;
        }

        .user-card .info {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .user-card .info-item {
            text-align: center;
            font-size: 13px;
            color: #94A3B8;
        }

        .user-card .info-item strong {
            display: block;
            color: #E2E8F0;
            font-size: 14px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            color: #E2E8F0;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(37, 211, 102, 0.2);
        }

        .menu-card i {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .menu-card .menu-label {
            font-size: 13px;
            font-weight: 600;
        }

        .menu-card.edit i {
            color: #2563EB;
        }

        .menu-card.logout i {
            color: #EF4444;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
        }

        .footer-link {
            text-align: center;
            color: #64748B;
            font-size: 12px;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon"><i class="fas fa-th-large"></i></div>
            <h1>Dashboard</h1>
            <p>Selamat datang di sistem registrasi API WhatsApp</p>
        </div>

        <div class="user-card" id="userCard">
            <div class="avatar" id="userAvatar">A</div>
            <div class="name" id="userName">Andre Dwi Maulana</div>
            <div class="email" id="userEmail">andre@test.com</div>
            <div class="info">
                <div class="info-item">
                    <strong id="userPhone">-</strong>
                    WhatsApp
                </div>
                <div class="info-item">
                    <strong id="userAlamat">-</strong>
                    Alamat
                </div>
            </div>
        </div>

        <div class="menu-grid">
            <a href="edit.html" class="menu-card edit">
                <i class="fas fa-user-edit"></i>
                <span class="menu-label">Edit Profil</span>
            </a>
            <div class="menu-card logout" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i>
                <span class="menu-label">Logout</span>
            </div>
        </div>

        <button class="btn-logout" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>

        <div class="footer-link">
            <i class="fas fa-shield-alt"></i> Sistem Integrasi REST API & WhatsApp Gateway
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const userData = JSON.parse(localStorage.getItem('userData') || 'null');
            console.log("📥 Data user:", userData);

            if (!userData) {
                alert('⚠️ Sesi login habis! Silakan login ulang.');
                window.location.href = 'login.html';
                return;
            }

            // Isi data user
            document.getElementById('userName').textContent = userData.nama || '-';
            document.getElementById('userEmail').textContent = userData.email || '-';
            document.getElementById('userPhone').textContent = userData.no_hp || '-';
            document.getElementById('userAlamat').textContent = userData.alamat || '-';
            document.getElementById('userAvatar').textContent = (userData.nama || 'A').charAt(0).toUpperCase();
        });

        function handleLogout() {
            if (confirm('Yakin ingin logout?')) {
                localStorage.removeItem('userData');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>

</html>
